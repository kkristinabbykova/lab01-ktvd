# При каждом push в main: автотесты -> экспорт marimo-датчика -> лендинг -> GitHub Pages.
# Включить один раз: Settings -> Pages -> Source: GitHub Actions.
name: Тесты и сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: pip install -r requirements.txt
      - name: "Автотесты (датчики, измеритель шрифтов, сайт)"
        run: python -m pytest -q
      - name: "Сайт: marimo html-wasm + лендинг"
        run: python tools/build_site.py
        env:
          LAB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          LAB_MAIN_URL: ${{ vars.LAB_MAIN_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
